agent:
  thread_count: 4
  server_url: https://localhost:27000
  retry_interval: 30s
  verification_mode: none
  queue_size: 10000
events:
  batch_interval: 10s
  batch_size: 1MB
inventory:
  enabled: true
  interval: 1h
  scan_on_start: true
  hardware: true
  system: true
  networks: true
  packages: true
  ports: true
  ports_all: false
  processes: false
logcollector:
  enabled: true
  reload_interval: 1m
  read_interval: 500ms
  macos:
    - level: info
  # Agent-side syslog listeners (UDP/TCP). Disabled by default: no listener is
  # started unless explicitly configured here. bind_address defaults to 127.0.0.1.
  # syslog:
  #   - protocol: udp
  #     bind_address: 127.0.0.1
  #     port: 5514
  #   - protocol: tcp
  #     bind_address: 127.0.0.1
  #     port: 1514
